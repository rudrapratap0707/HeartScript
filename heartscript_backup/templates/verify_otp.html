<!DOCTYPE html>
<html lang="en">
<head>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&display=swap" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style> /* Use the same <style> block from forgot_password.html here */ 
        :root { --primary: #ff416c; --secondary: #ff4b2b; }
        body { background: linear-gradient(135deg, #fff5f6 0%, #fdfcfb 100%); font-family: 'Poppins', sans-serif; min-height: 100vh; display: flex; align-items: center; justify-content: center; margin: 0; overflow-x: hidden; }
        .bg-shape { position: absolute; z-index: -1; filter: blur(60px); border-radius: 50%; opacity: 0.3; animation: float 10s infinite alternate; }
        .shape-1 { width: 400px; height: 400px; background: var(--primary); top: -150px; right: -100px; }
        .shape-2 { width: 350px; height: 350px; background: var(--secondary); bottom: -100px; left: -100px; }
        @keyframes float { from { transform: translate(0, 0); } to { transform: translate(30px, 50px); } }
        .forgot-container { background: rgba(255, 255, 255, 0.9); backdrop-filter: blur(15px); padding: 40px; border-radius: 30px; box-shadow: 0 25px 50px rgba(0,0,0,0.1); max-width: 450px; width: 90%; text-align: center; border: 1px solid rgba(255, 255, 255, 0.5); position: relative; }
        .brand-name { font-family: 'Great Vibes', cursive; font-size: 2.8rem; color: var(--primary); margin-bottom: 5px; }
        .instruction { color: #666; font-size: 0.85rem; margin-bottom: 25px; background: #fff0f3; padding: 12px; border-radius: 10px; border-left: 4px solid var(--primary); }
        .form-control { border-radius: 12px; padding: 12px; border: 1.5px solid #eee; transition: 0.3s; }
        .form-control:focus { border-color: var(--primary); box-shadow: 0 0 10px rgba(255, 65, 108, 0.1); }
        .btn-reset { background: linear-gradient(to right, var(--primary), var(--secondary)); border: none; padding: 14px; border-radius: 12px; width: 100%; font-weight: 600; color: white; margin-top: 15px; transition: 0.4s; box-shadow: 0 10px 20px rgba(255, 65, 108, 0.2); }
        .btn-reset:hover { transform: translateY(-3px); box-shadow: 0 15px 25px rgba(255, 65, 108, 0.3); }
        .back-link a { color: #888; text-decoration: none; font-size: 0.9rem; transition: 0.3s; }
        .back-link a:hover { color: var(--primary); }
    </style>
</head>
<body>
    <div class="bg-shape shape-1"></div>
    <div class="bg-shape shape-2"></div>
    <div class="forgot-container">
        <div class="brand-name">HeartScript</div>
        <h5 class="mb-3">Verify OTP</h5>
        <div class="instruction">Humne aapke email par ek <b>6-digit code</b> bheja hai. Check karein!</div>

        <form action="{{ url_for('verify_otp') }}" method="POST">
            <div class="mb-4">
                <input type="text" name="otp" class="form-control text-center fw-bold" placeholder="0 0 0 0 0 0" maxlength="6" style="font-size: 1.8rem; letter-spacing: 8px; color: var(--primary);" required>
            </div>
            <button type="submit" class="btn-reset">Verify & Proceed</button>
        </form>
    </div>
</body>
</html>
