<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Password | HeartScript</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&family=Great+Vibes&family=Playfair+Display:wght@600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body style="margin: 0; padding: 0; font-family: 'Poppins', sans-serif; background: #fff5f6; min-height: 100vh; display: flex; align-items: center; justify-content: center; overflow: hidden; position: relative;">

    <div style="position: absolute; width: 450px; height: 450px; background: linear-gradient(135deg, #ff416c, #ff4b2b); filter: blur(80px); border-radius: 50%; top: -150px; right: -100px; opacity: 0.25; z-index: 1;"></div>
    <div style="position: absolute; width: 400px; height: 400px; background: #ffc0cb; filter: blur(80px); border-radius: 50%; bottom: -100px; left: -100px; opacity: 0.4; z-index: 1;"></div>

    <div style="position: relative; z-index: 10; background: rgba(255, 255, 255, 0.85); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); padding: 45px; border-radius: 35px; box-shadow: 0 25px 50px rgba(0,0,0,0.08); width: 90%; max-width: 420px; border: 1px solid rgba(255, 255, 255, 0.6); text-align: center;">
        
        <div style="font-family: 'Great Vibes', cursive; font-size: 3.2rem; color: #ff416c; margin-bottom: 5px; text-shadow: 2px 2px 4px rgba(0,0,0,0.05);">HeartScript</div>
        <h2 style="font-family: 'Playfair Display', serif; color: #333; font-size: 1.5rem; margin: 0 0 15px 0;">Naya Password Set Karein</h2>
        
        <div style="background: rgba(255, 65, 108, 0.08); color: #666; font-size: 0.82rem; padding: 12px; border-radius: 15px; border-left: 5px solid #ff416c; margin-bottom: 25px; line-height: 1.4; text-align: left;">
            <i class="fas fa-shield-alt" style="color: #ff416c; margin-right: 5px;"></i> 
            Aapka account secure rahe, isliye ek unique aur strong password select karein. ✨
        </div>

        <form action="{{ url_for('reset_password') }}" method="POST" id="resetForm">
            <div style="text-align: left; margin-bottom: 18px; position: relative;">
                <label style="font-size: 0.75rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 5px; display: block; margin-bottom: 8px;">New Password</label>
                <div style="position: relative;">
                    <i class="fas fa-lock" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #ff416c; opacity: 0.6;"></i>
                    <input type="password" id="password" name="password" placeholder="At least 6 characters" required minlength="6"
                        style="width: 100%; padding: 14px 15px 14px 45px; border-radius: 15px; border: 1.5px solid #eee; box-sizing: border-box; font-size: 0.95rem; outline: none; transition: 0.3s; background: white;">
                </div>
                <div id="strength-meter" style="height: 4px; width: 0%; background: #eee; margin-top: 8px; border-radius: 2px; transition: 0.4s all ease;"></div>
            </div>

            <div style="text-align: left; margin-bottom: 30px;">
                <label style="font-size: 0.75rem; font-weight: 700; color: #555; text-transform: uppercase; letter-spacing: 0.5px; margin-left: 5px; display: block; margin-bottom: 8px;">Confirm Password</label>
                <div style="position: relative;">
                    <i class="fas fa-check-double" style="position: absolute; left: 15px; top: 50%; transform: translateY(-50%); color: #ff416c; opacity: 0.6;"></i>
                    <input type="password" id="confirm_password" name="confirm_password" placeholder="Repeat your password" required
                        style="width: 100%; padding: 14px 15px 14px 45px; border-radius: 15px; border: 1.5px solid #eee; box-sizing: border-box; font-size: 0.95rem; outline: none; transition: 0.3s; background: white;">
                </div>
            </div>

            <button type="submit" 
                style="background: linear-gradient(45deg, #ff416c, #ff4b2b); color: white; border: none; padding: 16px; width: 100%; border-radius: 18px; font-weight: 600; font-size: 1rem; cursor: pointer; transition: 0.4s; box-shadow: 0 10px 25px rgba(255, 65, 108, 0.3); display: flex; align-items: center; justify-content: center; gap: 10px;">
                Update Password <i class="fas fa-heart"></i>
            </button>
        </form>

        <div style="margin-top: 25px; font-size: 0.85rem;">
            <a href="{{ url_for('user_login') }}" style="color: #999; text-decoration: none; transition: 0.3s;" onmouseover="this.style.color='#ff416c'" onmouseout="this.style.color='#999'">
                <i class="fas fa-arrow-left"></i> Wapas login par jayein
            </a>
        </div>
    </div>

    <script>
        const passInput = document.getElementById('password');
        const meter = document.getElementById('strength-meter');

        passInput.addEventListener('input', function() {
            const val = passInput.value;
            let strength = 0;
            if (val.length >= 6) strength += 33;
            if (val.match(/[A-Z]/)) strength += 33;
            if (val.match(/[0-9]/) || val.match(/[^A-Za-z0-9]/)) strength += 34;

            meter.style.width = strength + '%';
            if (strength <= 33) meter.style.backgroundColor = '#ff4b2b';
            else if (strength <= 66) meter.style.backgroundColor = '#ffcc00';
            else meter.style.backgroundColor = '#28a745';
        });

        document.getElementById('resetForm').onsubmit = function(e) {
            const p1 = document.getElementById('password').value;
            const p2 = document.getElementById('confirm_password').value;
            if (p1 !== p2) {
                alert("Passwords match nahi ho rahe! ❌");
                e.preventDefault();
            }
        };
    </script>

</body>
</html>
